services:
  api:
    build: .
    platform: linux/amd64
    image: agungtrue/julu_api:latest
    container_name: julu_api
    restart: always
    volumes:
      - ./ca-certificate.crt:/usr/src/app/ca-certificate.crt
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DB_HOST=DB_HOST
      - DB_PORT=25060
      - DB_USER=DB_USER
      - DB_PASS=DB_PASSWORD
      - DB_NAME=julu_pos
      - JWT_SECRET=JWT_SECRET=
    expose: ["3006"]
image: node:22

pipelines:
  branches:
    main:
      - step:
          name: Build and Push Docker Image (AMD64)
          services:
            - docker
          script:
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            
            - docker build -t $DOCKERHUB_USERNAME/julu_api:latest .
            
            - docker push $DOCKERHUB_USERNAME/julu_api:latest
            
      - step:
          name: Deployment to VPS
          script:
            - ssh -p 22 root@139.59.108.251 "
                cd /root/julu-stack &&
                echo '$DOCKERHUB_PASSWORD' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin &&
                docker compose pull julu-api &&
                docker compose up -d --no-deps julu-api &&
                docker image prune -f
              "

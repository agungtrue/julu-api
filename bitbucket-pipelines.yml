# image: docker:cli

definitions:
  volumes:
    varrun: /var/run
    julustack: /root/julu-stack

pipelines:
  branches:
    main:
      - step:
          name: Build & Deploy Only API Service
          runs-on:
            - self.hosted
            - linux
          volumes:
            - varrun:/var/run
            - julustack:/root/julu-stack
          script:
            - export DOCKER_HOST=unix:///var/run/docker.sock

            - whoami
            - ls -lh /var/run/docker.sock
            - docker --version

            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            - docker build -t agungtrue/julu_api:latest .

            - docker push agungtrue/julu_api:latest

            - cd /root/julu-stack

            - docker compose up -d --no-deps julu-api

            - docker image prune -f

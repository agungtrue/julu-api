services:
  api:
    build: .
    container_name: julu_api_local
    restart: always
    ports:
      - "3006:3006"
    environment:
      # - NODE_ENV=development
      - NODE_ENV=local
      # Individual variables that match your NestJS config
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=syuhadadwiagung
      - DB_PASS=benarbiru
      - DB_NAME=julu_pos_kasir
      # Also keep DATABASE_URL for other potential uses
      - DATABASE_URL=postgres://syuhadadwiagung:benarbiru@db:5432/julu_pos_kasir
      # - JWT_SECRET=&17_JVlv@=
    env_file:
      - .env.local
    depends_on:
      - db
    command: >
      sh -c "
        echo 'Environment variables:'
        echo 'DB_HOST: '$DB_HOST
        echo 'DB_PORT: '$DB_PORT  
        echo 'DB_USER: '$DB_USER
        echo 'DB_NAME: '$DB_NAME
        echo 'Waiting for database...'
        until nc -z db 5432; do
          echo 'Database not ready, waiting...'
          sleep 5
        done
        echo 'Database ready...'
        echo 'Running migrations...'
        npm run migration:run
        echo 'Starting app...'
        npm run start:dev
      "

  db:
    image: postgres:15
    container_name: julu_db
    restart: always
    environment:
      POSTGRES_USER: syuhadadwiagung
      POSTGRES_PASSWORD: benarbiru
      POSTGRES_DB: julu_pos_kasir
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syuhadadwiagung -d julu_pos_kasir"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  db_data:

networks:
  app_network:
    driver: bridge